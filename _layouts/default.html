<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
</head>
<body>
    <header class="site-header">
      <div class="container">
        <div class="site-brand">
          <h1 class="site-title"><a href="{{ site.baseurl }}/">{{ site.title }}</a></h1>
          <p class="site-tagline">{{ site.description }}</p>
        </div>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ site.baseurl }}/">Projects</a>
          <a href="{{ site.baseurl }}/about/">About</a>
        </nav>
      </div>
    </header>

    <main>
        {{ content }}
    </main>
    
    <footer class="site-footer">
      <div class="container">
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
        <div class="social-icons" aria-hidden="false">
          <a href="https://github.com/{{ site.github_username }}" class="social-icon" aria-label="GitHub" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="grey" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387 .6.111 .82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.726-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.09-.745.083-.73.083-.73 1.205.084 1.84 1.236 1.84 1.236 1.07 1.835 2.809 1.305 3.495.998 .108-.775.418-1.305.762-1.605-2.665-.3-5.466-1.335-5.466-5.93 0-1.31.468-2.38 1.235-3.22-.135-.303-.54-1.524.105-3.176 0 0 1.005-.322 3.3 1.23 .96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23 .645 1.652 .24 2.873.12 3.176 .765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92 .42.36 .81 1.096 .81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315 .21 .69 .825 .57C20.565 23.092 24 18.592 24 13.297 24 5.73 18.63 .297 12 .297z"/></svg>
          </a>
          {% if site.linkedin_username %}
          <a href="https://linkedin.com/in/{{ site.linkedin_username }}" class="social-icon" aria-label="LinkedIn" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="grey" d="M19 0h-14c-2.76 0-5 2.24-5 5v14c0 2.76 2.24 5 5 5h14c2.76 0 5-2.24 5-5v-14c0-2.76-2.24-5-5-5zm-11 19h-3v-10h3v10zm-1.5-11.3c-.966 0-1.75-.79-1.75-1.7s.784-1.7 1.75-1.7 1.75.79 1.75 1.7-.784 1.7-1.75 1.7zm13.5 11.3h-3v-5.6c0-1.3-.5-2.2-1.7-2.2-1 0-1.5.7-1.8 1.4-.1.2-.1.5-.1.8v5.6h-3v-10h3v1.4c.4-.6 1.2-1.6 3-1.6 2.2 0 3.8 1.4 3.8 4.4V19z"/></svg>
          </a>
          {% endif %}
        </div>
      </div>
    </footer>
</body>
</html>
